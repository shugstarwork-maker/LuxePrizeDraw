    <linearGradient id="noteDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#95c77c"/><stop offset="1" stop-color="#245c47"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2a8"/><stop offset=".4" stop-color="#e7b64d"/><stop offset="1" stop-color="#8a5314"/></linearGradient>

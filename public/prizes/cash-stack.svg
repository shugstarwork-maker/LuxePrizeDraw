<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Stacked bundles of British pound notes</title>
  <desc id="desc">A premium illustration of multiple bound stacks of pound notes with a gold one hundred thousand pound prize card.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07171b"/><stop offset=".54" stop-color="#102d2c"/><stop offset="1" stop-color="#020706"/></linearGradient>
